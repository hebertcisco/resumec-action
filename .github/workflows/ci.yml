name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Ensure the bundled action is current
        run: git diff --exit-code -- dist/

  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate fixture
        uses: ./
        with:
          command: validate
          input: test/fixtures/resume.yaml
      - name: Build fixture
        id: resumec
        uses: ./
        with:
          input: test/fixtures/resume.yaml
          output-dir: test-output
          format: both
      - name: Verify outputs
        shell: bash
        run: |
          test -f test-output/resume.pdf
          test -f test-output/resume.docx

